name: Update mai.txt

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and parse subscription
        shell: bash
        run: |
          set -euo pipefail

          SUB_URL='https://sub.mia.xx.kg/sub?host=example.com&uuid=00000000-0000-4000-8000-000000000000'

          echo "Fetching:"
          echo "$SUB_URL"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            --connect-timeout 15 \
            --max-time 60 \
            -A 'v2rayN/edge-tunnel' \
            "$SUB_URL" \
            -o /tmp/sub.txt

          echo "Response size:"
          wc -c /tmp/sub.txt

          echo "First 200 bytes:"
          head -c 200 /tmp/sub.txt | cat -v
          echo

          python3 <<'PY'
          import base64
          import ipaddress
          import re
          from pathlib import Path

          raw_bytes = Path("/tmp/sub.txt").read_bytes()

          raw = raw_bytes.decode("utf-8", errors="ignore").strip()

          print("Content length:", len(raw))

          # --------------------------------------------------
          # 1. 优先判断是否已经是明文订阅
          # --------------------------------------------------

          if re.search(
              r'(?m)^(?:vless|vmess|trojan|ss|ssr)://',
              raw
          ):
              print("Detected plain-text subscription.")
              decoded = raw

          else:
              # --------------------------------------------------
              # 2. 尝试 Base64
              # --------------------------------------------------

              compact = re.sub(r'\s+', '', raw)

              # Base64URL -> Base64
              compact = compact.replace('-', '+').replace('_', '/')

              # 补齐 =
              compact += '=' * (-len(compact) % 4)

              try:
                  decoded_bytes = base64.b64decode(
                      compact,
                      validate=True
                  )

                  decoded = decoded_bytes.decode(
                      "utf-8",
                      errors="ignore"
                  )

                  print("Base64 decoded successfully.")

              except Exception as e:
                  print("Base64 decode failed:", e)

                  # --------------------------------------------------
                  # 3. 尝试处理双重 Base64
                  # --------------------------------------------------

                  try:
                      decoded_bytes = base64.b64decode(
                          compact,
                          validate=False
                      )

                      second = decoded_bytes.decode(
                          "utf-8",
                          errors="ignore"
                      )

                      second_compact = re.sub(
                          r'\s+',
                          '',
                          second
                      )

                      second_compact = (
                          second_compact
                          .replace('-', '+')
                          .replace('_', '/')
                      )

                      second_compact += '=' * (
                          -len(second_compact) % 4
                      )

                      decoded = base64.b64decode(
                          second_compact
                      ).decode(
                          "utf-8",
                          errors="ignore"
                      )

                      print("Double Base64 decoded successfully.")

                  except Exception as e2:
                      print("Double Base64 decode failed:", e2)

                      print(
                          "The response is not a recognizable "
                          "VLESS/Base64 subscription."
                      )

                      raise SystemExit(1)

          # --------------------------------------------------
          # 打印协议统计，不打印完整订阅
          # --------------------------------------------------

          protocols = {}

          for line in decoded.splitlines():
              line = line.strip()

              if "://" not in line:
                  continue

              proto = line.split("://", 1)[0].lower()

              protocols[proto] = protocols.get(proto, 0) + 1

          print("Protocols:", protocols)

          # --------------------------------------------------
          # 提取公网 IP:PORT
          # --------------------------------------------------

          result = set()

          for line in decoded.splitlines():

              line = line.strip()

              if not line:
                  continue

              # VLESS / Trojan / VMess 等 URI
              m = re.search(
                  r'^[a-zA-Z0-9+.-]+://'
                  r'[^@\s]+@'
                  r'($begin:math:display$\[0\-9a\-fA\-F\:\]\+$end:math:display$|'
                  r'(?:\d{1,3}\.){3}\d{1,3})'
                  r':(\d+)',
                  line
              )

              if not m:
                  continue

              host = m.group(1).strip("[]")
              port = int(m.group(2))

              try:
                  ip = ipaddress.ip_address(host)
              except ValueError:
                  continue

              # 只保留公网 IP
              if not ip.is_global:
                  continue

              if not (1 <= port <= 65535):
                  continue

              result.add(f"{ip}:{port}")

          ips = sorted(
              result,
              key=lambda x: (
                  x.rsplit(":", 1)[0],
                  int(x.rsplit(":", 1)[1])
              )
          )

          print("Found public IPs:", len(ips))

          if not ips:
              print()
              print("No public IPs found.")
              print()
              print(
                  "This usually means the subscription "
                  "does not contain literal IP addresses."
              )
              print(
                  "For example, nodes may use a domain such as "
                  "example.com instead of an IP."
              )
              raise SystemExit(1)

          Path("mai.txt").write_text(
              "\n".join(ips) + "\n",
              encoding="utf-8"
          )

          print("mai.txt updated.")

          PY

      - name: Commit changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add mai.txt

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "chore: update mai.txt"
          git push
