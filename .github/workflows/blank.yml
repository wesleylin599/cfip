```yaml
name: Clean and Push best-ip

on:
  push:
    paths:
      - "ips.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean and deduplicate ips.txt
        run: |
          awk '
          {
            if (match($0, /^([0-9a-fA-F:.]+:[0-9]+#[A-Za-z]{2})/, m)) {
              print m[1]
            }
          }
          ' ips.txt | awk '!seen[$0]++' > ips.txt.tmp

          mv ips.txt.tmp ips.txt

      - name: Push to best-ip branch
        run: |
          git fetch origin best-ip || true

          if git show-ref --verify --quiet refs/remotes/origin/best-ip; then
            git checkout -B best-ip origin/best-ip
          else
            git checkout -B best-ip
          fi

          cp ips.txt /tmp/clean-ips.txt

          git checkout "${GITHUB_SHA}" -- ips.txt
          cp /tmp/clean-ips.txt ips.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ips.txt

          if git diff --cached --quiet; then
            echo "No changes to ips.txt"
            exit 0
          fi

          git commit -m "chore: update ips.txt"
          git push origin best-ip
```
