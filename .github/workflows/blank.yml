name: Clean ips.txt

on:
  push:
    paths:
      - "ips.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean and deduplicate ips.txt
        run: |
          awk '
          {
            if (match($0, /^([0-9a-fA-F:.]+:[0-9]+#[A-Za-z]{2})/, m)) {
              print m[1]
            }
          }
          ' ips.txt | awk '!seen[$0]++' > ips.txt.tmp

          mv ips.txt.tmp ips.txt

      - name: Check changes
        id: changes
        run: |
          if git diff --quiet -- ips.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ips.txt
          git commit -m "chore: clean and deduplicate ips.txt"
          git push
