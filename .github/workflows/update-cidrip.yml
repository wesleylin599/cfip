name: Update CIDR IP List

on:
  workflow_dispatch:

  push:
    paths:
      - "cidr.txt"

  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Generate IP list
        run: python generate_cidr_ip.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cidrip.txt

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update cidrip.txt"
            git push
          fi
