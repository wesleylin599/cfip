name: Cloudflare IP Probe

on:
  workflow_dispatch:

  push:
    paths:
      - "cidr.txt"
      - "scripts/**"
      - ".github/workflows/cidrip.yml"

permissions:
  contents: write

concurrency:
  group: cf-cidrip
  cancel-in-progress: false


jobs:

  # ==========================================
  # 1. CIDR -> IP 分片
  # ==========================================
  prepare:
    name: Prepare IP shards
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate IP shards
        run: |
          python3 scripts/01_expand.py

      - name: Read matrix
        id: matrix
        shell: bash
        run: |
          MATRIX=$(cat matrix.json)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

      - name: Upload IP shards
        uses: actions/upload-artifact@v6
        with:
          name: ip-parts
          path: parts/


  # ==========================================
  # 2. 从你的网络实际探测 Cloudflare
  #
  # 注意：
  # 必须是 self-hosted runner
  # ==========================================
  probe:
    name: Probe ${{ matrix.part }}

    needs: prepare

    strategy:
      fail-fast: false
      max-parallel: 20

      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    runs-on: [self-hosted, linux, korea]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download IP shards
        uses: actions/download-artifact@v6
        with:
          name: ip-parts
          path: parts/

      - name: Check environment
        run: |
          python3 --version
          curl --version

      - name: Check Cloudflare route
        run: |
          echo "Testing Cloudflare colo from this runner..."
          curl -sS --noproxy "*" --resolve api.090227.xyz:443:172.64.184.14 https://api.090227.xyz/cdn-cgi/trace

      - name: Probe IPs
        run: |
          mkdir -p results

          python3 scripts/02_cfprobe.py \
            "parts/${{ matrix.part }}" \
            "results/${{ matrix.part }}"

      - name: Upload result
        uses: actions/upload-artifact@v6
        with:
          name: result-${{ matrix.part }}
          path: results/${{ matrix.part }}


  # ==========================================
  # 3. 合并
  # ==========================================
  merge:
    name: Merge results
    needs: probe

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all results
        uses: actions/download-artifact@v6
        with:
          pattern: result-*
          path: results/
          merge-multiple: true

      - name: Merge cidrip.txt
        run: |
          python3 scripts/03_merge.py

      - name: Show result
        run: |
          echo "======================================"
          echo "cidrip.txt"
          echo "======================================"
          cat cidrip.txt

      - name: Commit cidrip.txt
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cidrip.txt

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update cidrip.txt"

          git pull --rebase origin main

          git push origin HEAD:main
