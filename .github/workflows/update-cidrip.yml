name: Cloudflare CIDR IP Probe

on:

  workflow_dispatch:

  push:
    paths:
      - "cidr.txt"
      - "scripts/**"
      - ".github/workflows/cidrip.yml"

  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

# 防止两个 workflow 同时修改 main
concurrency:
  group: cfip-cidrip
  cancel-in-progress: false


jobs:

  # ==================================================
  # 1. CIDR → IP 分片
  # ==================================================

  prepare:

    name: Expand CIDR

    runs-on: ubuntu-latest

    outputs:
      parts: ${{ steps.matrix.outputs.parts }}

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Expand CIDR
        run: |
          rm -rf parts
          python scripts/01_expand.py

      - name: Generate Matrix
        id: matrix
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import json
          import os

          files = sorted(
              glob.glob("parts/part_*.txt")
          )

          names = [
              os.path.basename(x)
              for x in files
          ]

          print(f"Parts: {len(names)}")

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a"
          ) as f:

              f.write(
                  "parts=" +
                  json.dumps(names) +
                  "\n"
              )
          PY

      - name: Upload Parts
        uses: actions/upload-artifact@v4
        with:
          name: cidr-parts
          path: parts/


  # ==================================================
  # 2. 并行 CF-Ray 检测
  # ==================================================

  probe:

    name: Probe ${{ matrix.part }}

    needs: prepare

    runs-on: ubuntu-latest

    strategy:

      fail-fast: false

      # 最多同时运行 20 个 GitHub Runner
      max-parallel: 20

      matrix:
        part: ${{ fromJSON(needs.prepare.outputs.parts) }}

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependency
        run: |
          pip install airportsdata

      - name: Download parts
        uses: actions/download-artifact@v5
        with:
          name: cidr-parts
          path: parts/

      - name: Probe Cloudflare
        run: |

          mkdir -p results

          python scripts/02_cfprobe.py \
            --input "parts/${{ matrix.part }}" \
            --output "results/${{ matrix.part }}"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.part }}
          path: results/${{ matrix.part }}


  # ==================================================
  # 3. 合并
  # ==================================================

  merge:

    name: Merge Results

    needs: probe

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Download results
        uses: actions/download-artifact@v5
        with:
          pattern: result-*
          path: results/
          merge-multiple: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Merge
        run: |
          python scripts/03_merge.py

      # ==============================================
      # 4. 提交 cidrip.txt
      # ==============================================

      - name: Commit
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add cidrip.txt

          if git diff --cached --quiet; then

            echo "No changes"
            exit 0

          fi

          git commit -m "Update cidrip.txt"

          # 防止本地 / 其他 workflow 已经更新 main
          git pull --rebase origin main

          git push origin HEAD:main
