name: Update Best IPs

on:
  # ================================================================
  # 当 main 分支的 best_ips.txt 发生变化时自动执行
  # ================================================================
  push:
    branches:
      - main
    paths:
      - best_ips.txt

  # ================================================================
  # 支持 GitHub Actions 页面手动执行
  # ================================================================
  workflow_dispatch:

# ================================================================
# GitHub Actions 权限
# ================================================================
permissions:
  contents: write


jobs:

  process:

    name: Select Top 10 CF IPs

    runs-on: ubuntu-latest


    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

        with:
          fetch-depth: 0

          token: ${{ secrets.GITHUB_TOKEN }}


      # ============================================================
      # 2. 检查 best_ips.txt
      # ============================================================
      - name: Check input

        id: input

        shell: bash

        run: |

          set -e


          echo "=========================================="
          echo "Checking best_ips.txt"
          echo "=========================================="


          # --------------------------------------------------------
          # 文件不存在
          # --------------------------------------------------------
          if [ ! -f best_ips.txt ]; then

            echo "ERROR: best_ips.txt does not exist."

            echo "valid=false" >> "$GITHUB_OUTPUT"

            exit 0

          fi


          # --------------------------------------------------------
          # 文件为空
          # --------------------------------------------------------
          if [ ! -s best_ips.txt ]; then

            echo "ERROR: best_ips.txt is empty."

            echo "valid=false" >> "$GITHUB_OUTPUT"

            exit 0

          fi


          echo "best_ips.txt exists."

          echo "File size:"

          wc -c best_ips.txt


          echo "valid=true" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 3. 解析 IP / 延迟 / 带宽
      #
      # 按带宽排序
      # 取 Top 10
      # ============================================================
      - name: Select Top 10

        if: steps.input.outputs.valid == 'true'

        shell: bash

        run: |

          set -e


          python3 <<'PY'

          import re


          INPUT = "best_ips.txt"

          OUTPUT = "/tmp/best_ips_top10.txt"


          entries = []

          seen = set()


          # ========================================================
          # 读取 best_ips.txt
          # ========================================================
          with open(
              INPUT,
              "r",
              encoding="utf-8"
          ) as f:


              for line_number, line in enumerate(
                  f,
                  1
              ):


                  line = line.strip()


                  # ------------------------------------------------
                  # 忽略空行
                  # ------------------------------------------------
                  if not line:
                      continue


                  # ==================================================
                  # 获取 IP:PORT
                  #
                  # 示例：
                  #
                  # 172.64.229.114:443
                  # ==================================================
                  ip_match = re.search(
                      r'((?:\d{1,3}\.){3}\d{1,3}):(\d+)',
                      line
                  )


                  if not ip_match:


                      print(
                          f"Skip line {line_number}: "
                          f"IP:PORT not found"
                      )


                      continue


                  ip = ip_match.group(1)

                  port = ip_match.group(2)


                  # ==================================================
                  # 获取测速信息
                  #
                  # 示例：
                  #
                  # [78ms 20Mbps]
                  # ==================================================
                  speed_match = re.search(
                      r'\['
                      r'(\d+(?:\.\d+)?)ms'
                      r'\s+'
                      r'(\d+(?:\.\d+)?)Mbps'
                      r'\]',
                      line
                  )


                  if not speed_match:


                      print(
                          f"Skip line {line_number}: "
                          f"speed information not found"
                      )


                      continue


                  latency_text = speed_match.group(1)

                  bandwidth_text = speed_match.group(2)


                  latency = float(
                      latency_text
                  )

                  bandwidth = float(
                      bandwidth_text
                  )


                  # ==================================================
                  # 提取 [优选高速]
                  #
                  # 示例：
                  #
                  # [优选高速]
                  #
                  # 也支持其他类似标签：
                  #
                  # [优选低延迟]
                  # [高速]
                  # ==================================================
                  tag_match = re.search(
                      r'(\[[^\]]+\])\s*'
                      r'\['
                      r'\d+(?:\.\d+)?ms'
                      r'\s+'
                      r'\d+(?:\.\d+)?Mbps'
                      r'\]',
                      line
                  )


                  if tag_match:

                      tag = tag_match.group(1)

                  else:

                      tag = "[优选高速]"


                  # ==================================================
                  # IP:PORT 去重
                  # ==================================================
                  key = f"{ip}:{port}"


                  if key in seen:

                      print(
                          f"Skip duplicate: {key}"
                      )

                      continue


                  seen.add(key)


                  # ==================================================
                  # 保存
                  # ==================================================
                  entries.append(
                      {
                          "ip": ip,

                          "port": port,

                          "latency": latency,

                          "bandwidth": bandwidth,

                          "latency_text": latency_text,

                          "bandwidth_text": bandwidth_text,

                          "tag": tag,
                      }
                  )


          # ========================================================
          # 排序
          #
          # 第一优先级：
          #     带宽高 → 低
          #
          # 第二优先级：
          #     延迟低 → 高
          # ========================================================
          entries.sort(
              key=lambda item: (
                  -item["bandwidth"],
                  item["latency"]
              )
          )


          # ========================================================
          # 只取前 10
          # ========================================================
          top10 = entries[:10]


          if not top10:

              raise SystemExit(
                  "ERROR: No valid IPs found."
              )


          # ========================================================
          # 输出最终文件
          #
          # 注意：
          #
          # # 后面没有空格
          #
          # 格式：
          #
          # IP:PORT#[优选高速] [78ms 20Mbps]
          # ========================================================
          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:


              for item in top10:


                  f.write(
                      f"{item['ip']}:{item['port']}#"
                      f"{item['tag']} "
                      f"[{item['latency_text']}ms "
                      f"{item['bandwidth_text']}Mbps]\n"
                  )


          # ========================================================
          # 输出 Actions 日志
          # ========================================================
          print("")

          print(
              "=========================================="
          )

          print(
              "             CF BEST IP TOP 10"
          )

          print(
              "=========================================="
          )


          for index, item in enumerate(
              top10,
              1
          ):


              print(
                  f"{index:02d}. "
                  f"{item['ip']}:{item['port']}#"
                  f"{item['tag']} "
                  f"[{item['latency_text']}ms "
                  f"{item['bandwidth_text']}Mbps]"
              )


          print(
              "=========================================="
          )


          print(
              f"Total valid IPs: {len(entries)}"
          )


          print(
              f"Selected: {len(top10)}"
          )


          print(
              "=========================================="
          )


          PY


      # ============================================================
      # 4. 查看最终文件
      # ============================================================
      - name: Show final result

        if: steps.input.outputs.valid == 'true'

        shell: bash

        run: |

          echo ""

          echo "=========================================="

          echo "             FINAL RESULT"

          echo "=========================================="


          cat /tmp/best_ips_top10.txt


          echo "=========================================="

          echo ""


      # ============================================================
      # 5. 推送到 best-ip
      # ============================================================
      - name: Push to best-ip

        if: steps.input.outputs.valid == 'true'

        shell: bash

        run: |

          set -e


          # ========================================================
          # Git 用户配置
          # ========================================================
          git config user.name \
            "github-actions[bot]"


          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          # ========================================================
          # 检查远程 best-ip 是否存在
          # ========================================================
          if git ls-remote \
              --exit-code \
              --heads \
              origin \
              best-ip \
              > /dev/null 2>&1
          then


            echo "Remote branch best-ip exists."


            # ------------------------------------------------------
            # 获取远程 best-ip
            # ------------------------------------------------------
            git fetch \
              origin \
              best-ip


            # ------------------------------------------------------
            # 使用远程 best-ip 作为当前分支
            #
            # 这样可以避免：
            #
            # Your local changes would be overwritten by checkout
            #
            # ------------------------------------------------------
            git checkout \
              -B best-ip \
              origin/best-ip


          else


            echo "Remote branch best-ip does not exist."


            # ------------------------------------------------------
            # 创建 orphan 分支
            # ------------------------------------------------------
            git checkout \
              --orphan \
              best-ip


            # ------------------------------------------------------
            # 清空当前工作区
            # ------------------------------------------------------
            git rm \
              -rf \
              . \
              2>/dev/null || true


          fi


          # ========================================================
          # 写入最终 best_ips.txt
          # ========================================================
          cp \
            /tmp/best_ips_top10.txt \
            best_ips.txt


          # ========================================================
          # 显示准备提交的内容
          # ========================================================
          echo ""

          echo "=========================================="

          echo "          CONTENT TO PUSH"

          echo "=========================================="


          cat best_ips.txt


          echo "=========================================="


          # ========================================================
          # Git add
          # ========================================================
          git add best_ips.txt


          # ========================================================
          # 检查文件是否有变化
          # ========================================================
          if git diff \
              --cached \
              --quiet
          then


            echo "No changes detected."

            exit 0


          fi


          # ========================================================
          # Commit
          # ========================================================
          git commit \
            -m "Update best IPs"


          # ========================================================
          # Push best-ip
          # ========================================================
          git push \
            origin \
            best-ip


          echo ""

          echo "Successfully pushed to best-ip."